name = "Desktop"
description = "ZGraphics desktop application with a reusable window module, text UI, mouse input, and keyboard exit."
version = "1.0.0"
required_zplus_version = "0.5.0"
default_target_type = "executable"
platforms = ["Windows (interpreter or native)", "Linux (interpreter with X11)"]
required_modules = ["zgraphics"]
aliases = ["gui"]
configuration = ["backend=interpreter"]
directories = ["src/ui", "assets", "tests"]
files = ["zproject.toml", "README.md", "src/main.zp", "src/window.zh", "src/ui/layout.zh"]
