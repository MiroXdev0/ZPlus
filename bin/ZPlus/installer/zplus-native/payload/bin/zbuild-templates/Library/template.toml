name = "Library"
description = "Reusable public Z+ source modules with a test executable; no unsupported library binary is claimed."
version = "1.0.0"
required_zplus_version = "0.5.0"
default_target_type = "source_module"
platforms = ["Windows", "Linux"]
required_modules = []
aliases = ["lib"]
configuration = ["backend=interpreter"]
directories = ["src", "tests"]
files = ["zproject.toml", "README.md", "src/main.zh", "src/utilities.zh", "tests/main.zp"]
