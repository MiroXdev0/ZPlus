[project]
name = "{{PROJECT_NAME}}"
version = "{{PROJECT_VERSION}}"
description = "An empty Z+ project created in {{YEAR}}"
entry = "src/main.zp"

[build]
backend = "{{BUILD_BACKEND}}"
mode = "{{BUILD_MODE}}"
output_dir = "build"
optimization = 0
jobs = 0

[compiler]
warnings = true
debug_symbols = false

[platform]
windows = true
linux = true
