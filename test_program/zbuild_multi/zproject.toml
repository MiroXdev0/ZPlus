[project]
name = "ZBuildIntegration"
version = "1.0.0"
description = "ZBuild multi-target integration fixture"
entry = "src/main.zp"
sources = ["src"]

[build]
backend = "native"
mode = "debug"
output_dir = "build"
optimization = 0
jobs = 2

[compiler]
warnings = true
debug_symbols = false

[platform]
windows = true
linux = true

[assets]
directories = ["assets"]
preserve_structure = true

[tests]
targets = ["app_tests"]

[[target]]
name = "app"
type = "executable"
entry = "src/main.zp"

[[target]]
name = "other"
type = "executable"
entry = "src/other.zp"

[[target]]
name = "interpreter_app"
type = "executable"
entry = "tests/interpreter.zp"
backend = "interpreter"

[[target]]
name = "app_tests"
type = "test"
entry = "tests/main.zp"
dependencies = ["app"]
