<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thanks for reaching out — Northstar Studio</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main class="contact-section" style="min-height:100vh;display:grid;align-items:center">
    <section class="shell" style="max-width:720px">

      <h1>Thanks, <span>{{name}}.</span></h1>

      <a class="button button-dark" href="/">Back to Northstar <span aria-hidden="true">↗</span></a>
    </section>
  </main>
</body>
</html>
