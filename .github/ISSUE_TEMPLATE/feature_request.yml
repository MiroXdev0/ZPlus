name: Feature proposal
description: Propose a language, toolchain, or documentation improvement.
title: "[Proposal]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Distinguish suggested syntax/API from existing Z+ syntax.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and backend considerations
    validations:
      required: false
