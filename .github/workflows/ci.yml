name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux development dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libx11-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 1
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Publish CI diagnostics
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cmake --build build --config Release --parallel 1 > build-diagnostics.txt 2>&1
          ctest --test-dir build -C Release --output-on-failure > ctest-diagnostics.txt 2>&1
          "CI diagnostics for run $env:GITHUB_RUN_ID (commit $env:GITHUB_SHA):" | Out-File -FilePath diagnostics-body.md -Encoding utf8
          "--- build ---" | Out-File -FilePath diagnostics-body.md -Append -Encoding utf8
          Get-Content build-diagnostics.txt -Tail 150 | Out-File -FilePath diagnostics-body.md -Append -Encoding utf8
          "--- ctest ---" | Out-File -FilePath diagnostics-body.md -Append -Encoding utf8
          Get-Content ctest-diagnostics.txt -Tail 200 | Out-File -FilePath diagnostics-body.md -Append -Encoding utf8
          gh issue create --repo "${{ github.repository }}" --title "CI diagnostics (run $env:GITHUB_RUN_ID, $env:RUNNER_OS)" --body-file diagnostics-body.md

  ecosystem-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and validate ecosystem metadata
        run: |
          node scripts/generate-ecosystem-metadata.mjs --check
          node scripts/check-ecosystem.mjs
          node --test scripts/ecosystem-metadata.test.mjs
      - name: Check website
        run: |
          npm ci --prefix website
          npm run check --prefix website
          npm test --prefix website
      - name: Check VS Code extension
        run: |
          npm ci --prefix 'ZPlus_VS_code_extension'
          npm run check --prefix 'ZPlus_VS_code_extension'
          npm test --prefix 'ZPlus_VS_code_extension'
      - name: Package VS Code extension
        working-directory: ZPlus_VS_code_extension
        run: npx --yes @vscode/vsce@4.1.1 package --no-dependencies --out "${RUNNER_TEMP}/zplus-language-check.vsix"
      - name: Test web interop tool
        run: npm test --prefix tools/zplus-web-interop
